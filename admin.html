<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel organizatora</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="hero">
  <div class="hero-content">
    <h1>📚 Panel organizatora</h1>
    <p>Zarządzanie książkami</p>
  </div>
</header>

<main class="container">

  <!-- LOGOWANIE -->

  <section id="loginSection" class="panel">

    <h2>🔐 Logowanie organizatora</h2>

    <form id="loginForm">

      <input
        type="email"
        id="email"
        placeholder="E-mail"
        autocomplete="username"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Hasło"
        autocomplete="current-password"
        required
      >

      <button type="submit">
        Zaloguj się
      </button>

    </form>

    <p id="loginMessage"></p>

  </section>


  <!-- PANEL PO ZALOGOWANIU -->

  <section id="adminSection" class="panel" style="display:none;">

    <div class="admin-header">

      <div>
        <h2>📚 Książki</h2>
        <p id="booksCount"></p>
      </div>

      <button id="logoutButton" class="secondary-button">
        Wyloguj
      </button>

    </div>


    <!-- DODAWANIE -->

    <div class="admin-form">

      <h2>➕ Dodaj książkę</h2>

      <form id="bookForm">

        <input
          type="text"
          id="title"
          placeholder="Tytuł książki"
          required
        >

        <input
          type="text"
          id="subject"
          placeholder="Przedmiot"
        >

        <input
          type="text"
          id="className"
          placeholder="Klasa"
        >

        <div class="price-row">

          <input
            type="number"
            id="priceFrom"
            placeholder="Cena od (zł)"
            min="0"
            step="0.01"
            required
          >

          <input
            type="number"
            id="priceTo"
            placeholder="Cena do (zł)"
            min="0"
