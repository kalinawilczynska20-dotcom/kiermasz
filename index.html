<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiermasz podręczników</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="hero">
    <div class="hero-content">
      <h1>📚 Kiermasz podręczników</h1>
      <p>Sprawdź dostępne książki i ich ceny</p>
    </div>
  </header>

  <main class="container">

    <div class="toolbar">
      <input
        type="search"
        id="searchInput"
        placeholder="🔎 Szukaj książki..."
      >

      <select id="filterSelect">
        <option value="all">Wszystkie</option>
        <option value="available">Dostępne</option>
        <option value="sold">Sprzedane</option>
      </select>
    </div>

    <div id="booksList" class="books-grid">
      <p class="loading">Ładowanie książek...</p>
    </div>

  </main>

  <footer>
    <a href="admin.html">Panel organizatora</a>
  </footer>

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      onValue
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDydhZ5DRkS8uqQCwl4GS9jdecxpMBrvLw",
      authDomain: "kiermasz-edf65.firebaseapp.com",
      projectId: "kiermasz-edf65",
      storageBucket: "kiermasz-edf65.firebasestorage.app",
      messagingSenderId: "24113147575",
      appId: "1:24113147575:web:20c3bee6d1df4451876732"
    };

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    const booksRef = ref(database, "books");

    const booksList = document.getElementById("booksList");
    const searchInput = document.getElementById("searchInput");
    const filterSelect = document.getElementById("filterSelect");

    let books = [];

    function escapeHTML(text) {
      if (text === undefined || text === null) return "";

      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatPrice(book) {

      // Nowe książki — cena od / do
      if (book.priceFrom !== undefined && book.priceFrom !== null) {

        const from = Number(book.priceFrom);
        const to = Number(book.priceTo ?? book.priceFrom);

        if (from === to) {
          return `${from.toFixed(2).replace(".", ",")} zł`;
        }

        return `${from.toFixed(2).replace(".", ",")}–${to.toFixed(2).replace(".", ",")} zł`;
      }

      // Stare książki — pojedyncza cena
      if (book.price !== undefined && book.price !== null) {
        return `${Number(book.price).toFixed(2).replace(".", ",")} zł`;
      }

      return "Cena nie podana";
    }

    function renderBooks() {

      const search = searchInput.value.toLowerCase().trim();
      const filter = filterSelect.value;

      const filteredBooks = books.filter(book => {

        const text = `
          ${book.title || ""}
          ${book.subject || ""}
          ${book.className || ""}
        `.toLowerCase();

        const matchesSearch = text.includes(search);

        const stock = Number(book.stock || 0);

        let matchesFilter = true;

        if (filter === "available") {
          matchesFilter = stock > 0;
        }

        if (filter === "sold") {
          matchesFilter = stock === 0;
        }

        return matchesSearch && matchesFilter;
      });

      if (filteredBooks.length === 0) {
        booksList.innerHTML = `
          <div class="empty">
            <p>😕 Nie znaleziono żadnych książek.</p>
          </div>
        `;
        return;
      }

      booksList.innerHTML = filteredBooks.map(book => {

        const stock = Number(book.stock || 0);

        const stockText =
          stock > 0
            ? `Dostępne: ${stock} szt.`
            : "Sprzedane";

        const stockClass =
          stock > 0
            ? "stock available"
            : "stock sold";

        const imageHTML = book.image
          ? `
            <img
              src="${escapeHTML(book.image)}"
              alt="${escapeHTML(book.title)}"
              class="book-image"
              onerror="this.style.display='none'"
            >
          `
          : `
            <div class="book-image-placeholder">
              📚
            </div>
          `;

        return `
          <article class="book-card">

            ${imageHTML}

            <div class="book-info">

              <h2>${escapeHTML(book.title)}</h2>

              ${
                book.subject
                  ? `<p><strong>Przedmiot:</strong> ${escapeHTML(book.subject)}</p>`
                  : ""
              }

              ${
                book.className
                  ? `<p><strong>Klasa:</strong> ${escapeHTML(book.className)}</p>`
                  : ""
              }

              <p class="price">
                ${formatPrice(book)}
              </p>

              <p class="${stockClass}">
                ${stockText}
              </p>

            </div>

          </article>
        `;

      }).join("");
    }

    onValue(booksRef, snapshot => {

      const data = snapshot.val();

      books = data
        ? Object.entries(data).map(([id, book]) => ({
            id,
            ...book
          }))
        : [];

      books.sort((a, b) =>
        String(a.title || "").localeCompare(
          String(b.title || ""),
          "pl"
        )
      );

      renderBooks();
    });

    searchInput.addEventListener("input", renderBooks);
    filterSelect.addEventListener("change", renderBooks);

  </script>

</body>
</html>
